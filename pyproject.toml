[project]
name = "inbox-recall"
version = "1.0.0"
description = "Hybrid semantic + keyword search over every chat you have (Beeper networks + Instagram), served to self-hosted agents over MCP."
readme = "README.md"
license = "MIT"
authors = [{ name = "Joey Hersh" }]
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]
keywords = ["mcp", "pgvector", "hybrid-search", "rag", "beeper", "postgres", "instagram", "messages", "agents"]

[project.scripts]
inbox-recall = "inbox_recall.cli:main"
beeper-pg-sync = "beeper_pg_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beeper_pg_sync", "src/inbox_recall"]

[tool.pytest.ini_options]
testpaths = ["tests/sync", "tests/recall"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
