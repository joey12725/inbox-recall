<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}.box{fill:#f6f7f9;stroke:#d0d4dc;stroke-width:1.5}.db{fill:#eef4ff;stroke:#5b7cfa;stroke-width:2}
    .t{fill:#1f2328;font-size:15px;font-weight:600}.s{fill:#59636e;font-size:12px}.a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#h)}
    .tag{fill:#5b7cfa;font-size:11px;font-weight:600;letter-spacing:.06em}
    @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}.db{fill:#14203d;stroke:#6e8bff}.t{fill:#e6edf3}.s{fill:#9198a1}.a{stroke:#6e7681}.tag{fill:#8ea4ff}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8c959f"/></marker></defs>
  <rect class="bg" width="960" height="400" rx="16"/>
  <text class="tag" x="40" y="44">SOURCES</text>
  <rect class="box" x="40" y="60" width="250" height="92" rx="12"/>
  <text class="t" x="60" y="92">Beeper Desktop API</text>
  <text class="s" x="60" y="114">WhatsApp, Signal, Telegram, Discord,</text>
  <text class="s" x="60" y="132">iMessage, SMS, Instagram and more</text>
  <rect class="box" x="40" y="176" width="250" height="78" rx="12"/>
  <text class="t" x="60" y="208">Chrome extension</text>
  <text class="s" x="60" y="230">Instagram DMs from the browser</text>
  <rect class="box" x="40" y="278" width="250" height="78" rx="12"/>
  <text class="t" x="60" y="310">CSV / ZIP / JSON exports</text>
  <text class="s" x="60" y="332">saved by the extension</text>
  <text class="tag" x="350" y="44">BEEPER-PG-SYNC</text>
  <rect class="box" x="350" y="60" width="250" height="92" rx="12"/>
  <text class="t" x="370" y="92">sync daemon</text>
  <text class="s" x="370" y="114">read-only, resumable, per-chat</text>
  <text class="s" x="370" y="132">frontiers + budgeted backfill</text>
  <rect class="box" x="350" y="176" width="250" height="78" rx="12"/>
  <text class="t" x="370" y="208">ingest server</text>
  <text class="s" x="370" y="230">POST /v1/ingest/instagram</text>
  <rect class="box" x="350" y="278" width="250" height="78" rx="12"/>
  <text class="t" x="370" y="310">beeper-pg-sync import</text>
  <text class="s" x="370" y="332">one-off backfills from files</text>
  <path class="a" d="M290 106h52"/><path class="a" d="M290 215h52"/><path class="a" d="M290 317h52"/>
  <text class="tag" x="670" y="44">POSTGRES</text>
  <rect class="db" x="670" y="60" width="250" height="296" rx="14"/>
  <text class="t" x="690" y="94">Store.ingest()</text>
  <text class="s" x="690" y="116">one write path, cross-source dedupe</text>
  <text class="s" x="690" y="156">conversations</text>
  <text class="s" x="690" y="178">participants</text>
  <text class="s" x="690" y="200">messages  (stable ids)</text>
  <text class="s" x="690" y="222">message_sources</text>
  <text class="s" x="690" y="244">sync_state, sync_runs</text>
  <text class="s" x="690" y="284">message_timeline view</text>
  <text class="s" x="690" y="306">full-text index, NOTIFY on change</text>
  <path class="a" d="M600 106h62"/><path class="a" d="M600 215h62"/><path class="a" d="M600 317h62"/>
</svg>
