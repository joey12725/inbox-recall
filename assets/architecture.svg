<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}.box{fill:#f6f7f9;stroke:#d0d4dc;stroke-width:1.5}.db{fill:#eef4ff;stroke:#5b7cfa;stroke-width:2}
    .hot{fill:#fff6e8;stroke:#e8a33d;stroke-width:2}
    .t{fill:#1f2328;font-size:15px;font-weight:600}.s{fill:#59636e;font-size:12px}.m{fill:#1f2328;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .a{stroke:#8c959f;stroke-width:2;fill:none;marker-end:url(#h)}.d{stroke:#8c959f;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#h)}
    .tag{fill:#5b7cfa;font-size:11px;font-weight:600;letter-spacing:.06em}.tag2{fill:#c27c12;font-size:11px;font-weight:600;letter-spacing:.06em}
    .lbl{fill:#59636e;font-size:11px;font-style:italic}.t2{fill:#1f2328;font-size:14px;font-weight:600}
    @media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#30363d}.db{fill:#14203d;stroke:#6e8bff}.hot{fill:#2a1f0e;stroke:#d29922}.t,.t2,.m{fill:#e6edf3}.s,.lbl{fill:#9198a1}.a,.d{stroke:#6e7681}.tag{fill:#8ea4ff}.tag2{fill:#e3b341}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8c959f"/></marker></defs>
  <rect class="bg" width="1040" height="520" rx="16"/>

  <text class="tag" x="30" y="40">SOURCES</text>
  <rect class="box" x="30" y="54" width="200" height="86" rx="12"/>
  <text class="t" x="46" y="82">Beeper Desktop API</text>
  <text class="s" x="46" y="102">WhatsApp, Signal, iMessage,</text>
  <text class="s" x="46" y="119">Telegram, Discord, Slack...</text>
  <rect class="box" x="30" y="156" width="200" height="70" rx="12"/>
  <text class="t" x="46" y="184">Chrome extension</text>
  <text class="s" x="46" y="204">Instagram DMs</text>

  <text class="tag" x="270" y="40">SYNC</text>
  <rect class="box" x="270" y="54" width="200" height="172" rx="12"/>
  <text class="t" x="286" y="82">beeper-pg-sync</text>
  <text class="s" x="286" y="104">read-only, resumable,</text>
  <text class="s" x="286" y="121">per-chat backfill</text>
  <text class="s" x="286" y="148">cross-source dedupe</text>
  <text class="s" x="286" y="175">edits bump</text>
  <text class="m" x="286" y="193">content_updated_at</text>
  <path class="a" d="M230 97h32"/><path class="a" d="M230 191h32"/>

  <text class="tag" x="510" y="40">POSTGRES + PGVECTOR</text>
  <rect class="db" x="510" y="54" width="240" height="300" rx="14"/>
  <text class="m" x="528" y="86">messages</text>
  <text class="s" x="528" y="104">stable bigint ids, every network</text>
  <text class="m" x="528" y="136">message_embeddings</text>
  <text class="s" x="528" y="154">one HNSW index per model</text>
  <text class="m" x="528" y="186">GIN to_tsvector(english)</text>
  <text class="m" x="528" y="206">GIN trigram</text>
  <text class="s" x="528" y="224">full-text + fuzzy matching</text>
  <text class="m" x="528" y="256">conversations, participants</text>
  <text class="s" x="528" y="274">people, chats, time order</text>
  <text class="m" x="528" y="314">NOTIFY beeper_pg_sync</text>
  <text class="s" x="528" y="332">on every new or edited message</text>
  <path class="a" d="M470 140h32"/>

  <text class="tag" x="270" y="282">EMBEDDINGS</text>
  <rect class="box" x="270" y="296" width="200" height="86" rx="12"/>
  <text class="t" x="286" y="324">inbox-recall embed</text>
  <text class="s" x="286" y="344">incremental, resumable,</text>
  <text class="s" x="286" y="361">message + chat context</text>
  <rect class="box" x="30" y="296" width="200" height="86" rx="12"/>
  <text class="t" x="46" y="324">Embedding model</text>
  <text class="s" x="46" y="344">Ollama, LM Studio, OpenAI,</text>
  <text class="s" x="46" y="361">sentence-transformers</text>
  <path class="d" d="M510 322h-32"/><text class="lbl" x="476" y="314" text-anchor="end">wake</text>
  <path class="a" d="M470 350h32"/><text class="lbl" x="490" y="370" text-anchor="middle">vectors</text>
  <path class="a" d="M270 330h-32"/><path class="a" d="M238 350h24"/>

  <text class="tag2" x="790" y="40">INBOX-RECALL</text>
  <rect class="hot" x="790" y="54" width="220" height="172" rx="14"/>
  <text class="t" x="806" y="82">Hybrid retrieval</text>
  <text class="s" x="806" y="104">semantic + full-text + fuzzy,</text>
  <text class="s" x="806" y="121">reciprocal rank fusion</text>
  <text class="s" x="806" y="148">sender, person, chat, network,</text>
  <text class="s" x="806" y="165">direction, "last spring"</text>
  <text class="s" x="806" y="192">thread excerpts with</text>
  <text class="s" x="806" y="209">[#id] citations, cursors</text>
  <path class="a" d="M750 140h32"/>

  <rect class="box" x="790" y="246" width="220" height="108" rx="12"/>
  <text class="t" x="806" y="274">Interfaces</text>
  <text class="s" x="806" y="296">MCP over stdio and HTTP</text>
  <text class="s" x="806" y="316">REST API · CLI</text>
  <text class="s" x="806" y="336">6 read-only tools</text>
  <path class="a" d="M900 226v12"/>

  <rect class="box" x="510" y="404" width="500" height="86" rx="12"/>
  <text class="tag" x="526" y="430">YOUR AGENTS</text>
  <text class="t2" x="526" y="456">Claude Code · Claude Desktop · Cursor · OpenClaw · Hermes Agent</text>
  <text class="s" x="526" y="476">or any MCP client, local model or hosted</text>
  <path class="a" d="M900 354v42"/>
</svg>
